name: Retail Lakehouse Pipeline

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Pipeline run mode
        required: true
        default: hourly
        type: choice
        options:
          - hourly
          - daily

permissions:
  contents: read

concurrency:
  group: retail-lakehouse-azure-sync
  cancel-in-progress: false

jobs:
  retail-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Pull DuckDB state from Azure
        run: python data_collection/azure_sync.py --action pull-state

      - name: Clear local Bronze (upload only this run's delta)
        run: rm -rf data_collection/data/local_bronze && mkdir -p data_collection/data/local_bronze

      - name: Determine mode and run pipeline
        run: |
          if [[ "${{ github.event.schedule }}" == "17 2 * * *" || "${{ inputs.mode }}" == "daily" ]]; then
            MODE=daily
          else
            MODE=hourly
          fi
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          python data_collection/run_pipeline.py --mode "$MODE"

      - name: Push Bronze Parquet to Azure
        run: python data_collection/azure_sync.py --action push-bronze

      - name: Push DuckDB state to Azure
        run: python data_collection/azure_sync.py --action push-state

      - name: Job summary
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import duckdb

          db = Path("data_collection/dwh/retail_lakehouse_fresh.duckdb")
          if not db.exists():
              db = Path("dwh/retail_lakehouse_fresh.duckdb")

          conn = duckdb.connect(str(db), read_only=True)
          cols = [d[0] for d in conn.execute("SELECT * FROM live_market.RUN_LOGS LIMIT 0").description]
          row = conn.execute(
              "SELECT * FROM live_market.RUN_LOGS ORDER BY FINISHED_AT DESC LIMIT 1"
          ).fetchone()
          conn.close()
          lines = [f"## Retail Lakehouse Pipeline ({os.environ['MODE']})", "",
                   "Latest `RUN_LOGS` row:", "", "| Column | Value |", "| --- | --- |"]
          if row:
              lines += [f"| {c} | {v} |" for c, v in zip(cols, row)]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          PY

      - name: Post-upload data quality guard (silent failure check)
        run: python data_collection/check_run_health.py
