name: Build & Push Lakehouse Image (GHCR)

on:
  push:
    branches: [main]
    paths:
      - "lakehouse/**"
      - "transformations/**"
      - "data_collection/dwh/azure_sync.py"
      - "data_collection/azure_sync.py"
      - ".github/workflows/build_lakehouse_image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Lakehouse Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: lakehouse/Dockerfile
          push: true
          tags: |
            ghcr.io/ahmedsam001/supply-chain-lakehouse:latest
            ghcr.io/ahmedsam001/supply-chain-lakehouse:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
